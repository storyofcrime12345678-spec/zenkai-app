name: Build ZENKAI APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/zenkai/anime app/src/main/res/mipmap-xxhdpi
          echo "" | base64 -d > app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Zenkai"
          include ':app'
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.zenkai.anime'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.zenkai.anime'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="ZENKAI"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Black.NoTitleBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          cat > app/src/main/java/com/zenkai/anime/MainActivity.java <<'EOT'
          package com.zenkai.anime;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              static final String URL = "https://sparkly-kleicha-47571f.netlify.app";
              FrameLayout root;
              WebView web;
              View custom;
              WebChromeClient.CustomViewCallback customCb;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  // Blocks screenshots and screen recording (video area turns black)
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE);
                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View v, CustomViewCallback cb) {
                          if (custom != null) { cb.onCustomViewHidden(); return; }
                          custom = v;
                          customCb = cb;
                          web.setVisibility(View.GONE);
                          root.addView(v, new FrameLayout.LayoutParams(-1, -1));
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          getWindow().getDecorView().setSystemUiVisibility(
                                  View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                      }
                      @Override
                      public void onHideCustomView() { hideCustom(); }
                  });
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  web.loadUrl(URL);
              }

              void hideCustom() {
                  if (custom == null) return;
                  root.removeView(custom);
                  custom = null;
                  if (customCb != null) customCb.onCustomViewHidden();
                  customCb = null;
                  web.setVisibility(View.VISIBLE);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
              }

              @Override
              public void onBackPressed() {
                  if (custom != null) hideCustom();
                  else if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOT
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zenkai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
